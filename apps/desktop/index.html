<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotebookLM Desktop</title>
    <!--
      Theme bootstrap — runs before React mounts so the first paint has
      the right `dark` / `light` class AND the right `data-ds` attribute
      on <html>. Keep storage keys + class names + default pack in sync
      with packages/ui/src/components/ThemeProvider.tsx
      (FOUC_PREVENTION_SCRIPT).
    -->
    <script>
      (function () {
        try {
          var tk = "notebooklm-theme";
          var dk = "notebooklm-ds";
          var s = localStorage.getItem(tk);
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = s === "light" ? "light" : s === "dark" ? "dark" : sysDark ? "dark" : "light";
          var d = localStorage.getItem(dk);
          d = d === "saigon" || d === "render" ? d : "saigon";
          var h = document.documentElement;
          h.classList.add(r);
          h.classList.remove(r === "dark" ? "light" : "dark");
          h.style.colorScheme = r;
          h.setAttribute("data-ds", d);
        } catch (_) {}
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
