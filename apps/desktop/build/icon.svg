<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    NotebookLM desktop app icon — placeholder brand mark.
    Stylised open book in white on a blue→indigo gradient plate, mirroring
    the in-app SettingsChrome / NotebooksHeader logo so the dock/taskbar
    icon and the in-window brand mark look like the same product.

    Replace this SVG (and re-run `bun run build:icon`) when a real logo lands.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square plate. ~20% corner radius matches macOS Big Sur-era app icons. -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#plate)"/>

  <!-- Open book glyph centred on the plate. -->
  <g transform="translate(512, 512)">
    <!-- Left page (slightly tilted up at the spine). -->
    <path d="M -260 -210 L -20 -250 L -20 230 L -260 190 Z" fill="#ffffff"/>
    <!-- Right page. -->
    <path d="M 260 -210 L 20 -250 L 20 230 L 260 190 Z" fill="#ffffff"/>

    <!-- Decorative page lines. Light slate, low contrast — they add detail without
         turning the glyph into a face from afar (which monochrome books often do). -->
    <line x1="-220" y1="-130" x2="-60" y2="-160" stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>
    <line x1="-220" y1="-60"  x2="-60" y2="-90"  stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>
    <line x1="-220" y1="10"   x2="-60" y2="-20"  stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>

    <line x1="60" y1="-160" x2="220" y2="-130" stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="-90"  x2="220" y2="-60"  stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="-20"  x2="220" y2="10"   stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
