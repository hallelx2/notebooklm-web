<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    NotebookLM Desktop app icon. Matches the in-app brand mark used
    across the dock, sidebar, auth shell and onboarding chrome.

    Plate is the saigon accent green with a subtle gradient for depth
    at large sizes. Glyph is a stack of two books (the spirit of
    Material Symbols book_2) drawn in black so the mark stays high
    contrast at every size from 16px favicon up to 1024px Dock.

    1024 by 1024 source. Re run bun run build:icon whenever you edit
    this file. The script regenerates icon.png, icon.ico, and
    icon.icns in the same directory.
  -->
  <defs>
    <!-- Plate: accent → accent-hover, lit slightly from the top-left so
         the icon catches light the way a real app icon does on macOS /
         Windows 11. -->
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3e8bc"/>
      <stop offset="0.55" stop-color="#a0e0ab"/>
      <stop offset="1" stop-color="#8ad296"/>
    </linearGradient>

    <!-- Faint top-left sheen — keeps the icon from looking flat at
         large sizes; vanishes harmlessly at small sizes. -->
    <linearGradient id="plate-sheen" x1="0" y1="0" x2="0.7" y2="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square plate. ~20% corner radius matches macOS Big-Sur-era
       app icons and Windows 11 app tiles. -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#plate)"/>
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#plate-sheen)"/>

  <!-- book_2 glyph, hand-built to match the Material Symbols stack-of-
       books silhouette but kept readable down to 16×16. Two closed
       books standing upright, with a third book lying flat on top.
       All in black so the mark stays legible against the green plate
       at every size. -->
  <g transform="translate(512, 512)" fill="#0a0a0a">
    <!-- Soft shadow under the book stack to lift it off the plate. -->
    <ellipse cx="0" cy="270" rx="270" ry="14" fill="#000000" opacity="0.18"/>

    <!-- Left book — taller, ~60% of the stack width. -->
    <rect x="-260" y="-280" width="200" height="540" rx="24"/>
    <!-- Spine band: lighter accent strip up the left edge so the book
         reads as having a separate spine, not a flat block. -->
    <rect x="-260" y="-280" width="32" height="540" rx="24" fill="#a0e0ab" opacity="0.55"/>
    <!-- Two horizontal title bars on the spine. -->
    <rect x="-244" y="-200" width="0" height="0"/>
    <line x1="-220" y1="-160" x2="-90" y2="-160" stroke="#a0e0ab" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <line x1="-220" y1="-110" x2="-130" y2="-110" stroke="#a0e0ab" stroke-width="14" stroke-linecap="round" opacity="0.6"/>

    <!-- Right book — shorter, slight offset from the left book. -->
    <rect x="-30" y="-220" width="190" height="480" rx="22"/>
    <!-- Spine band on the right book. -->
    <rect x="-30" y="-220" width="30" height="480" rx="22" fill="#a0e0ab" opacity="0.55"/>
    <!-- Title bars. -->
    <line x1="10" y1="-100" x2="130" y2="-100" stroke="#a0e0ab" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <line x1="10" y1="-50" x2="90" y2="-50" stroke="#a0e0ab" stroke-width="14" stroke-linecap="round" opacity="0.6"/>

    <!-- A third book lying flat across the top of both — the
         "stack" silhouette that makes this read as `book_2` rather
         than a single notebook. -->
    <rect x="-250" y="-340" width="440" height="60" rx="16"/>
    <line x1="-220" y1="-310" x2="-30" y2="-310" stroke="#a0e0ab" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
