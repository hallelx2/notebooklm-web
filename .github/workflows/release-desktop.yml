# Desktop release pipeline.
#
# Trigger: push of a tag matching `v*.*.*` (e.g. `v0.2.0`). The tag must
# point at a commit on `main` whose `apps/desktop/package.json` version
# matches the tag — electron-builder reads the version from there and
# refuses to publish a mismatch.
#
# Outputs per platform: signed installer + electron-updater manifest
# (latest.yml / latest-mac.yml / latest-linux.yml). All assets uploaded
# to a GitHub Release named after the tag.
#
# Code signing — provided via repo secrets, all optional:
#   Windows:
#     CSC_LINK                — base64-encoded .pfx Authenticode cert
#     CSC_KEY_PASSWORD        — passphrase for the .pfx
#   macOS:
#     CSC_LINK_MAC            — base64-encoded Developer ID cert (.p12)
#     CSC_KEY_PASSWORD_MAC    — passphrase
#     APPLE_ID                — Apple ID for notarization
#     APPLE_APP_SPECIFIC_PASSWORD — app-specific password for notarytool
#     APPLE_TEAM_ID           — your team id, e.g. "XXXXXXXXXX"
#
# Without signing secrets the build still succeeds — the artifact just
# isn't trustable by electron-updater on the client side, so users
# would have to install upgrades manually until secrets land.

name: release-desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # let us kick off ad-hoc test releases without tagging

permissions:
  contents: write # required so electron-builder can create the GH Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate icons (PNG/ICO/ICNS from SVG)
        # Cheap and idempotent — guarantees electron-builder finds an
        # icon set matching the current SVG even if someone forgot to
        # commit the regenerated binaries.
        # `--filter=<name>` (with `=`) is the form bun parses
        # consistently across platforms; the space-separated form is
        # silently a no-op on some bun versions.
        run: bun "--filter=@notebooklm/desktop" run build:icon

      - name: Fetch bundled models (Kokoro + BGE-Small)
        run: bun "--filter=@notebooklm/desktop" run build:models

      - name: Build renderer (vite)
        # electron-builder packages whatever's already on disk under
        # `dist/` — without this step the installer would ship an
        # empty UI shell.
        run: bun "--filter=@notebooklm/desktop" run build

      # The publish steps below invoke electron-builder via `npx`, NOT
      # `bun x`. Reason: `bun x` exports `npm_config_user_agent=bun/...`
      # for the child process, which makes electron-builder's "install
      # production dependencies" step think bun is the package manager.
      # It then spawns `node /path/to/bun`, but `bun` is a native
      # ELF/Mach-O/PE binary — not a JS file — and Node errors with
      # `Invalid or unexpected token` on the binary's first byte. We
      # tried setting `npm_config_user_agent=npm/10` at the shell-env
      # level, but `bun x` overrides it for the spawned process, so
      # the override never reaches electron-builder.
      #
      # `npx` (which ships with Node, preinstalled on every GH runner)
      # sets `npm_config_user_agent=npm/...` itself, so electron-builder
      # picks npm and the prod-deps install works. We still install
      # the workspace with `bun install --frozen-lockfile` above for
      # speed; only the electron-builder invocation uses npx.
      #
      # Tracking: https://github.com/electron-userland/electron-builder/issues/8208

      - name: Build & publish (macOS)
        if: matrix.os == 'macos-14'
        env:
          # Apple signing + notarization — see header comment.
          CSC_LINK: ${{ secrets.CSC_LINK_MAC }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD_MAC }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          # --publish always — uploads to the GH Release and writes
          # latest-mac.yml. electron-builder picks the GitHub provider
          # from package.json's `build.publish` config.
          npx --no-install electron-builder --mac --publish always

      - name: Build & publish (Windows)
        if: matrix.os == 'windows-2022'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          npx --no-install electron-builder --win --publish always

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          npx --no-install electron-builder --linux --publish always

      - name: Upload artifacts (debugging fallback)
        # Even when --publish succeeds, also stash the artifacts on the
        # workflow run so we can grab them without hitting the
        # Releases page if a publish step glitches.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/**/*.exe
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.AppImage
            apps/desktop/release/**/*.deb
            apps/desktop/release/**/*.yml
            apps/desktop/release/**/*.blockmap
          if-no-files-found: ignore
          retention-days: 14
