# Desktop release pipeline.
#
# Trigger: push of a tag matching `v*.*.*` (e.g. `v0.2.0`). The tag must
# point at a commit on `main` whose `apps/desktop/package.json` version
# matches the tag — electron-builder reads the version from there and
# refuses to publish a mismatch.
#
# Outputs per platform: signed installer + electron-updater manifest
# (latest.yml / latest-mac.yml / latest-linux.yml). All assets uploaded
# to a GitHub Release named after the tag.
#
# Code signing — provided via repo secrets, all optional:
#   Windows:
#     CSC_LINK                — base64-encoded .pfx Authenticode cert
#     CSC_KEY_PASSWORD        — passphrase for the .pfx
#   macOS:
#     CSC_LINK_MAC            — base64-encoded Developer ID cert (.p12)
#     CSC_KEY_PASSWORD_MAC    — passphrase
#     APPLE_ID                — Apple ID for notarization
#     APPLE_APP_SPECIFIC_PASSWORD — app-specific password for notarytool
#     APPLE_TEAM_ID           — your team id, e.g. "XXXXXXXXXX"
#
# Without signing secrets the build still succeeds — the artifact just
# isn't trustable by electron-updater on the client side, so users
# would have to install upgrades manually until secrets land.

name: release-desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # let us kick off ad-hoc test releases without tagging

permissions:
  contents: write # required so electron-builder can create the GH Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Resolve bun catalog / workspace refs for npm"
        # electron-builder shells out to `npm install --omit=dev` inside
        # apps/desktop. npm doesn't understand bun's `catalog:` or
        # `workspace:*` specifiers, so we rewrite them to concrete
        # versions / file: paths before electron-builder runs. The
        # rewrite is in-place; the runner is ephemeral so we don't
        # bother restoring afterwards.
        run: node apps/desktop/scripts/resolve-monorepo-refs.mjs

      - name: "Verify no bun-specific specifiers leak into the install graph"
        # Belt-and-braces: if any package.json that npm could touch when
        # walking apps/desktop still has workspace:/catalog: refs at this
        # point, electron-builder's npm install would fail with
        # EUNSUPPORTEDPROTOCOL. Fail fast here with a useful error
        # instead of waiting for the cryptic CI error 5 minutes later.
        # We also check apps/web — npm walks up to the repo root, sees
        # the workspaces field, and tries to process every workspace
        # member (which is why the resolver also strips the workspaces
        # field, but defence-in-depth doesn't hurt).
        # `shell: bash` is required so windows-2022 runs Git Bash
        # instead of PowerShell — the script uses set/[ ]/grep -E.
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(grep -rEln '"(workspace|catalog):' \
            apps/desktop/package.json \
            apps/web/package.json \
            packages/*/package.json \
            node_modules/@notebooklm 2>/dev/null || true)
          if [ -n "$remaining" ]; then
            echo "::error::Bun-specific dep specifiers survived the resolver step:"
            echo "$remaining"
            for f in $remaining; do
              echo "--- $f ---"
              grep -nE '"(workspace|catalog):' "$f" || true
            done
            exit 1
          fi
          echo "Clean — no workspace:/catalog: specifiers reach electron-builder."

      - name: Regenerate icons (PNG/ICO/ICNS from SVG)
        # Cheap and idempotent — guarantees electron-builder finds an
        # icon set matching the current SVG even if someone forgot to
        # commit the regenerated binaries.
        # `--filter=<name>` (with `=`) is the form bun parses
        # consistently across platforms; the space-separated form is
        # silently a no-op on some bun versions.
        run: bun "--filter=@notebooklm/desktop" run build:icon

      - name: Fetch bundled models (Kokoro + BGE-Small)
        run: bun "--filter=@notebooklm/desktop" run build:models

      - name: Build renderer (vite)
        # electron-builder packages whatever's already on disk under
        # `dist/` — without this step the installer would ship an
        # empty UI shell.
        run: bun "--filter=@notebooklm/desktop" run build

      - name: "Pre-publish prep: chmod app-builder + strip root workspaces"
        # Two things have to happen between `bun install` and
        # electron-builder's first spawn of app-builder, and they're
        # both subtle:
        #
        # 1. `chmod +x` the platform-specific app-builder binary.
        #    bun's frozen-lockfile install lays the file down on Linux
        #    and macOS without the executable bit set. cross-spawn
        #    then surfaces that as ENOENT (not EACCES, despite the
        #    file being right there). On Windows it's a no-op but
        #    harmless.
        #
        # 2. Strip the `workspaces` field from the root package.json.
        #    electron-builder runs `npm install --omit=dev` inside
        #    apps/desktop. With the root workspaces field intact, npm
        #    walks up, sees the workspace members, decides to
        #    reconcile root node_modules, and prunes anything it
        #    considers unnecessary — including the binaries inside
        #    node_modules/app-builder-bin/. By the time electron-
        #    builder tries to spawn app-builder a few seconds later,
        #    the file is gone -> ENOENT. We can't strip earlier
        #    because `bun --filter=@notebooklm/desktop run build`
        #    fails with a bare ENOENT on ubuntu-22.04 if the workspaces
        #    field is missing when vite tries to spawn.
        #
        # Result: each platform-specific publish step below runs
        # against a workspaces-free root + an executable app-builder.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-22.04) bin="node_modules/app-builder-bin/linux/x64/app-builder" ;;
            macos-14)     bin="node_modules/app-builder-bin/mac/app-builder_arm64" ;;
            windows-2022) bin="node_modules/app-builder-bin/win/x64/app-builder.exe" ;;
            *) echo "::error::unhandled matrix os ${{ matrix.os }}" ; exit 1 ;;
          esac
          if [ ! -f "$bin" ]; then
            echo "::error::Expected app-builder binary missing at $bin"
            ls -laR node_modules/app-builder-bin || echo "(parent dir missing too)"
            exit 1
          fi
          chmod +x "$bin" || true
          ls -la "$bin"
          node -e "const fs=require('fs'); const f='package.json'; const p=JSON.parse(fs.readFileSync(f,'utf8')); if(p.workspaces){delete p.workspaces; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); console.log('stripped workspaces from root package.json');} else {console.log('workspaces field already absent');}"

      # The publish steps below invoke electron-builder via `npx`, NOT
      # `bun x`. Reason: `bun x` exports `npm_config_user_agent=bun/...`
      # for the child process, which makes electron-builder's "install
      # production dependencies" step think bun is the package manager.
      # It then spawns `node /path/to/bun`, but `bun` is a native
      # ELF/Mach-O/PE binary — not a JS file — and Node errors with
      # `Invalid or unexpected token` on the binary's first byte. We
      # tried setting `npm_config_user_agent=npm/10` at the shell-env
      # level, but `bun x` overrides it for the spawned process, so
      # the override never reaches electron-builder.
      #
      # `npx` (which ships with Node, preinstalled on every GH runner)
      # sets `npm_config_user_agent=npm/...` itself, so electron-builder
      # picks npm and the prod-deps install works. We still install
      # the workspace with `bun install --frozen-lockfile` above for
      # speed; only the electron-builder invocation uses npx.
      #
      # Tracking: https://github.com/electron-userland/electron-builder/issues/8208

      - name: Build & publish (macOS)
        if: matrix.os == 'macos-14'
        env:
          # Apple signing + notarization — see header comment.
          CSC_LINK: ${{ secrets.CSC_LINK_MAC }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD_MAC }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          # When the CSC_LINK secret isn't set, GitHub Actions still
          # passes CSC_LINK="" to the step env. electron-builder
          # treats any defined CSC_LINK as a path it must read,
          # resolves the empty string against cwd (apps/desktop),
          # then errors with `apps/desktop not a file`. Unset both
          # vars and tell electron-builder not to auto-discover an
          # identity in the keychain so it produces an unsigned dmg
          # instead of bombing out.
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS signing cert not configured — building unsigned dmg."
          fi
          # --publish always — uploads to the GH Release and writes
          # latest-mac.yml. electron-builder picks the GitHub provider
          # from package.json's `build.publish` config.
          npx --no-install electron-builder --mac --publish always

      - name: Build & publish (Windows)
        if: matrix.os == 'windows-2022'
        # Force bash so the `if [ -z ... ]` guard below works the same
        # way it does on the macOS step. windows-2022's default shell
        # is PowerShell, which can't parse POSIX test syntax.
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          # Same empty-CSC_LINK guard as the macOS step — without it,
          # electron-builder treats CSC_LINK="" as a missing pfx path
          # and errors during NSIS signing.
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "Windows signing cert not configured — building unsigned NSIS installer."
          fi
          npx --no-install electron-builder --win --publish always

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          npx --no-install electron-builder --linux --publish always

      - name: Upload artifacts (debugging fallback)
        # Even when --publish succeeds, also stash the artifacts on the
        # workflow run so we can grab them without hitting the
        # Releases page if a publish step glitches.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/**/*.exe
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.AppImage
            apps/desktop/release/**/*.deb
            apps/desktop/release/**/*.yml
            apps/desktop/release/**/*.blockmap
          if-no-files-found: ignore
          retention-days: 14
